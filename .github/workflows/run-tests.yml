name: Run tests

# Helper: runs the test suites the #743 and two-tone PRs touch, on Linux, for
# the branch given. Started by hand (Actions -> Run tests -> Run workflow) or
# by the apply workflows. It lives on main and checks the branch out, because
# the PR branches carry no helper files.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to test
        required: true
        default: pr-525
      repository:
        description: Repository the branch is in (dividebysandwich/sdroxide to test upstream main for comparison)
        required: true
        default: yankneck696/sdroxide

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      # No debug info and no incremental cache: the runner's disk is too small
      # for a full debug build of the engine with them (it ran out at the
      # engine tests).
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force || true
          df -h /
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.branch }}
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev pkg-config cmake autoconf automake libtool libclang-dev
      - name: Protocol, types, DSP and PlutoSDR
        run: cargo test --no-fail-fast -p sdroxide-proto -p sdroxide-types -p sdroxide-dsp -p sdroxide-pluto
      - name: Engine (radio crate, without SoapySDR)
        run: |
          df -h /
          cargo test --no-fail-fast --no-default-features -p sdroxide-radio
      - name: Translations
        run: cargo test -p sdroxide-ui i18n
