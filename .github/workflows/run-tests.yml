name: Run tests

# Helper: runs the test suites the #743 and two-tone PRs touch, on Linux, for
# the branch given. Started by hand (Actions -> Run tests -> Run workflow) or
# by the apply workflows. It lives on main and checks the branch out, because
# the PR branches carry no helper files.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to test
        required: true
        default: pr-525

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev pkg-config cmake autoconf automake libtool libclang-dev
      - name: Protocol, types, DSP and PlutoSDR
        run: cargo test -p sdroxide-proto -p sdroxide-types -p sdroxide-dsp -p sdroxide-pluto
      - name: Engine (radio crate, without SoapySDR)
        run: cargo test --no-default-features -p sdroxide-radio
      - name: Translations
        run: cargo test -p sdroxide-ui i18n
