name: Apply PlutoSDR patch 525 and build MSI

# Helper for issue #525. When sdroxide-525.patch is uploaded to main, this
# applies it on top of the current upstream sdroxide (dividebysandwich/main),
# pushes the result to the branch pr-525 (without these helper files), and
# starts the "Windows MSI" workflow on that branch for testing.
on:
  push:
    branches: [main]
    paths: ['sdroxide-525.patch']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply the patch on current upstream main
        run: |
          git config user.name "yankneck696"
          git config user.email "yankneck696@users.noreply.github.com"
          cp sdroxide-525.patch "$RUNNER_TEMP/p.patch"
          git fetch https://github.com/dividebysandwich/sdroxide.git main
          git checkout -B pr-525 FETCH_HEAD
          git am "$RUNNER_TEMP/p.patch"
          git push -f origin pr-525
      - name: Start the Windows MSI build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run windows-msi.yml --ref pr-525
